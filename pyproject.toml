[project]
name = "battery-advisor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "pydantic>=2,<3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/battery_advisor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
